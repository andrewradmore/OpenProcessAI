[project]
name = "openprocessai"
version = "0.1.0"
description = "Evidence-backed business process discovery and AI agent specification design"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License to be selected; see LICENSE placeholder" }
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.3,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
